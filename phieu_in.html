<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In Phiếu Trắc Nghiệm Chuyên Nghiệp</title>
<style>
  :root { --accent: #c8421a; }

  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #e2e8f0;
    margin: 0; padding: 20px;
    display: flex; flex-direction: column; align-items: center;
  }
  .controls {
    background: white; padding: 15px 30px; border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0,0,0,.1); margin-bottom: 20px;
    display: flex; gap: 15px; align-items: center;
  }
  select, button { font-size: 15px; padding: 8px 16px; border-radius: 6px; }
  button { background: var(--accent); color: white; border: none; cursor: pointer; font-weight: bold; }
  button:hover { background: #b03a16; }

  /* ══ Trang A4 ══════════════════════════════════════════════ */
  .a4-page {
    width: 210mm;
    min-height: 297mm;
    background: white;
    box-shadow: 0 10px 20px rgba(0,0,0,.15);
    position: relative;
    box-sizing: border-box;
  }

  /* ══ ANCHOR ════════════════════════════════════════════════
     Đặt thẳng trên .a4-page (không qua lớp padding).
     Dùng border solid thay background — LUÔN in được.
     Kích thước: 0×0, border 16px mỗi bên → thực tế 32×32px đen.
     Padding trắng 8px từ mép giấy.
  ══════════════════════════════════════════════════════════ */
  .anc {
    position: absolute;
    width: 0; height: 0;
    border: 16px solid black;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .anc.tl { top:  8px; left:  8px; }
  .anc.tr { top:  8px; right: 8px; }
  .anc.bl { bottom: 8px; left:  8px; }
  .anc.br { bottom: 8px; right: 8px; }

  /* ══ Nội dung bên trong ════════════════════════════════════ */
  .content {
    padding: 14mm 16mm 12mm 16mm;
    box-sizing: border-box;
  }

  /* Header */
  .school-info h2 { margin: 0 0 5px; font-size: 17px; color: #222; }
  .school-info p  { margin: 0; font-size: 13px; color: #555; }
  .student-info   { margin-top: 10px; font-size: 14px; line-height: 2.1; }
  .uline { border-bottom: 1px dotted #444; display: inline-block; }

  /* ══ OMR Frame (chuẩn tỷ lệ 800×1100 theo app.js) ══════════ */
  .omr-frame {
    position: relative;
    width: 100%;
    height: 248mm; /* 182mm × 1100/800 ≈ 250mm */
    margin-top: 8mm;
  }
  .region {
    position: absolute;
    box-sizing: border-box;
  }
  .bubble-grid {
    display: grid;
    width: 100%; height: 100%;
    align-items: center; justify-items: center;
  }
  .region-title {
    position: absolute; top: -22px; left: 0; width: 100%;
    text-align: center; font-weight: bold; font-size: 12px;
    color: var(--accent); text-transform: uppercase; letter-spacing: .5px;
  }
  .bubble {
    width: 19px; height: 19px;
    border: 1.5px solid #000;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: bold; color: #000;
    background: white;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .q-num {
    font-size: 13px; font-weight: bold; color: #333;
    display: flex; justify-content: flex-end;
    padding-right: 8px; align-items: center;
  }

  /* ══ Print ═════════════════════════════════════════════════ */
  @media print {
    body { background: transparent; padding: 0; margin: 0; }
    .controls { display: none; }
    .a4-page { box-shadow: none; margin: 0; }
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
    }
  }
</style>
</head>
<body>

<div class="controls">
  <label><b>Số câu hỏi:</b></label>
  <select id="numQ" onchange="renderSheet()">
    <option value="15">15 Câu</option>
    <option value="20" selected>20 Câu</option>
    <option value="30">30 Câu</option>
    <option value="40">40 Câu</option>
  </select>
  <button onclick="window.print()">🖨 In Phiếu OMR</button>
</div>

<div class="a4-page">
  <!-- Anchor trực tiếp trên a4-page, không qua lớp padding -->
  <div class="anc tl"></div>
  <div class="anc tr"></div>
  <div class="anc bl"></div>
  <div class="anc br"></div>

  <div class="content">
    <div class="school-info">
      <h2>PHIẾU TRẢ LỜI TRẮC NGHIỆM</h2>
      <p>Kỳ thi / Bài kiểm tra: <span class="uline" style="width:200px"></span></p>
      <div class="student-info">
        Họ và tên: <span class="uline" style="width:240px"></span><br>
        Lớp: <span class="uline" style="width:90px"></span> &nbsp;
        Ngày: <span class="uline" style="width:90px"></span>
      </div>
    </div>

    <!-- OMR Frame — % tọa độ khớp chính xác với REGION trong app.js -->
    <div class="omr-frame">
      <div id="regSBD"   class="region" style="left:12%;top:22%;width:30%;height:28%;">
        <div class="region-title">Số Báo Danh</div>
        <div id="gridSBD" class="bubble-grid"></div>
      </div>
      <div id="regCODE"  class="region" style="left:55%;top:22%;width:15%;height:28%;">
        <div class="region-title">Mã Đề</div>
        <div id="gridCODE" class="bubble-grid"></div>
      </div>
      <div id="regLeft"  class="region" style="left:4%; top:54%;width:44%;height:44%;"></div>
      <div id="regRight" class="region" style="left:52%;top:54%;width:44%;height:44%;"></div>
    </div>
  </div>
</div>

<script>
function renderSheet() {
  const numQ = parseInt(document.getElementById('numQ').value);
  const half = Math.ceil(numQ / 2);

  const sbd = document.getElementById('gridSBD');
  sbd.style.gridTemplateColumns = 'repeat(6,1fr)';
  sbd.style.gridTemplateRows    = 'repeat(10,1fr)';
  sbd.innerHTML = '';
  for (let r = 0; r < 10; r++)
    for (let c = 0; c < 6; c++)
      sbd.innerHTML += `<div class="bubble">${r}</div>`;

  const code = document.getElementById('gridCODE');
  code.style.gridTemplateColumns = 'repeat(3,1fr)';
  code.style.gridTemplateRows    = 'repeat(10,1fr)';
  code.innerHTML = '';
  for (let r = 0; r < 10; r++)
    for (let c = 0; c < 3; c++)
      code.innerHTML += `<div class="bubble">${r}</div>`;

  renderPanel('regLeft',  1,        half);
  renderPanel('regRight', half + 1, numQ);
}

function renderPanel(id, startQ, endQ) {
  const n = endQ - startQ + 1;
  const el = document.getElementById(id);
  if (n <= 0) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="bubble-grid"
    style="grid-template-columns:28% repeat(4,18%);grid-template-rows:repeat(${n},1fr);">
    ${Array.from({length:n}).map((_,i) => {
      const q = startQ + i;
      return `<div class="q-num">Câu ${q}:</div>
              <div class="bubble">A</div>
              <div class="bubble">B</div>
              <div class="bubble">C</div>
              <div class="bubble">D</div>`;
    }).join('')}
  </div>`;
}

renderSheet();
</script>
</body>
</html>
