<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In Phiếu Trắc Nghiệm OMR</title>
<style>
*,
*::before,
*::after {
  box-sizing: border-box;
}

:root {
  --page-w: 210mm;
  --page-h: 297mm;
  --ink: #000;
  --paper: #fff;
  --muted: #555;
  --line: #b8b8b8;
  --bubble: 4.1mm;
  --bubble-border: 0.38mm;
  --anchor: 8mm;
  --marker: 6px;
  --marker-gap: 12px;
  --font: "Segoe UI", "DejaVu Sans", Arial, sans-serif;
}

html,
body {
  margin: 0;
  min-height: 100%;
  font-family: var(--font);
  color: var(--ink);
  background: #e8edf3;
}

body {
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 18px;
}

.controls {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  margin-bottom: 16px;
  border-radius: 10px;
  background: #fff;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
  font-size: 14px;
}

.controls select,
.controls button {
  font: inherit;
  padding: 7px 12px;
  border: 1px solid #c8c8c8;
  border-radius: 7px;
  background: #fff;
}

.controls button {
  border-color: #1e3a5f;
  background: #1e3a5f;
  color: #fff;
  font-weight: 700;
  cursor: pointer;
}

.a4-page {
  position: relative;
  width: var(--page-w);
  height: var(--page-h);
  overflow: hidden;
  background: var(--paper);
  box-shadow: 0 12px 34px rgba(0, 0, 0, 0.22);
}

.anchor,
.region-marker {
  background: var(--ink);
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

.anchor {
  position: absolute;
  z-index: 10;
  width: var(--anchor);
  height: var(--anchor);
}

.anchor.tl { left: 5mm; top: 5mm; }
.anchor.tr { right: 5mm; top: 5mm; }
.anchor.bl { left: 5mm; bottom: 5mm; }
.anchor.br { right: 5mm; bottom: 5mm; }

.title {
  position: absolute;
  top: 15mm;
  left: 20mm;
  right: 20mm;
  text-align: center;
}

.title h1 {
  margin: 0;
  font-size: 17pt;
  line-height: 1.2;
  letter-spacing: 0.3mm;
}

.student-info {
  position: absolute;
  top: 32mm;
  left: 17mm;
  right: 17mm;
  font-size: 10.5pt;
  line-height: 1.8;
}

.student-info .row {
  display: grid;
  grid-template-columns: 1fr 38mm 38mm;
  gap: 8mm;
}

.field {
  display: inline-flex;
  align-items: baseline;
  gap: 3mm;
  white-space: nowrap;
}

.line {
  flex: 1;
  min-width: 24mm;
  border-bottom: 0.25mm dotted #555;
  height: 5mm;
}

.region {
  position: absolute;
}

/*
  Positions are compensated for the 5mm page anchors. After perspectiveWarp(),
  the table boxes land on the 800 x 1100 REGION/ANSWER_REGIONS values in app.js.
*/
.region-sbd {
  left: 11.1%;
  top: 19.65%;
  width: 41.7%;
  height: 23.7%;
}

.region-code {
  left: 61.1%;
  top: 19.65%;
  width: 23.2%;
  height: 23.7%;
}

.answer-panel[data-panel="1"] {
  left: 11.1%;
  top: 50%;
  width: 36.1%;
  height: 17.1%;
}

.answer-panel[data-panel="2"] {
  left: 52.8%;
  top: 50%;
  width: 36.1%;
  height: 17.1%;
}

.answer-panel[data-panel="3"] {
  left: 11.1%;
  top: 70.8%;
  width: 36.1%;
  height: 17.1%;
}

.answer-panel[data-panel="4"] {
  left: 52.8%;
  top: 70.8%;
  width: 36.1%;
  height: 17.1%;
}

.section-title {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(100% + 2mm);
  text-align: center;
  font-weight: 800;
  font-size: 9.5pt;
  text-transform: uppercase;
}

.answer-panel .section-title {
  bottom: calc(100% + 6mm);
}

.answer-head {
  position: absolute;
  left: 0;
  right: 0;
  bottom: calc(100% + 1.1mm);
  display: grid;
  grid-template-columns: 28% repeat(4, 1fr);
  font-size: 8.5pt;
  font-weight: 800;
  text-align: center;
}

.number-grid,
.answer-grid {
  width: 100%;
  height: 100%;
  border: 0.3mm solid var(--ink);
  background: var(--paper);
}

.number-grid {
  display: grid;
  grid-template-columns: 18% repeat(var(--cols), 1fr);
  grid-template-rows: repeat(10, 1fr);
}

.answer-grid {
  display: grid;
  grid-template-columns: 28% repeat(4, 1fr);
  grid-template-rows: repeat(10, 1fr);
}

.cell {
  display: flex;
  align-items: center;
  justify-content: center;
  min-width: 0;
  min-height: 0;
  border-right: 0.22mm solid var(--line);
  border-bottom: 0.22mm solid var(--line);
  font-size: 8pt;
  font-weight: 700;
}

.number-grid:not(.code-grid) .cell:nth-child(7n),
.code-grid .cell:nth-child(4n),
.answer-grid .cell:nth-child(5n) {
  border-right: 0;
}

.number-grid:not(.code-grid) .cell:nth-last-child(-n + 7),
.code-grid .cell:nth-last-child(-n + 4),
.answer-grid .cell:nth-last-child(-n + 5) {
  border-bottom: 0;
}

.bubble {
  width: var(--bubble);
  height: var(--bubble);
  border: var(--bubble-border) solid var(--ink);
  border-radius: 50%;
  background: var(--paper);
  -webkit-print-color-adjust: exact;
  print-color-adjust: exact;
}

.region-marker {
  position: absolute;
  z-index: 6;
  width: var(--marker);
  height: var(--marker);
  pointer-events: none;
}

.region-marker.tl {
  left: calc(-1 * var(--marker-gap));
  top: calc(-1 * var(--marker-gap));
}

.region-marker.tr {
  right: calc(-1 * var(--marker-gap));
  top: calc(-1 * var(--marker-gap));
}

.region-marker.bl {
  left: calc(-1 * var(--marker-gap));
  bottom: calc(-1 * var(--marker-gap));
}

.region-marker.br {
  right: calc(-1 * var(--marker-gap));
  bottom: calc(-1 * var(--marker-gap));
}

.footer {
  position: absolute;
  left: 17mm;
  right: 17mm;
  bottom: 9mm;
  padding-top: 2mm;
  border-top: 0.25mm dotted #aaa;
  color: var(--muted);
  text-align: center;
  font-size: 8pt;
}

@page {
  size: A4 portrait;
  margin: 0;
}

@media print {
  html,
  body {
    width: var(--page-w);
    height: var(--page-h);
    margin: 0;
    padding: 0;
    background: #fff;
  }

  body {
    display: block;
  }

  .controls {
    display: none !important;
  }

  .a4-page {
    width: var(--page-w);
    height: var(--page-h);
    margin: 0;
    overflow: hidden;
    box-shadow: none;
    page-break-before: avoid;
    page-break-after: avoid;
    page-break-inside: avoid;
  }

  .anchor,
  .region-marker {
    background: #000 !important;
  }

  .bubble {
    border-color: #000 !important;
    background: #fff !important;
  }
}
</style>
</head>
<body>
<div class="controls">
  <label for="numQ">Số câu:</label>
  <select id="numQ">
    <option value="10">10 câu</option>
    <option value="20" selected>20 câu</option>
    <option value="30">30 câu</option>
    <option value="40">40 câu</option>
  </select>
  <button type="button" onclick="window.print()">In phiếu OMR</button>
</div>

<main class="a4-page" id="sheet">
  <div class="anchor tl"></div>
  <div class="anchor tr"></div>
  <div class="anchor bl"></div>
  <div class="anchor br"></div>

  <header class="title">
    <h1>PHIẾU TRẢ LỜI TRẮC NGHIỆM</h1>
  </header>

  <section class="student-info">
    <div class="field">Kỳ thi / Bài kiểm tra:<span class="line"></span></div>
    <div class="row">
      <div class="field">Họ và tên:<span class="line"></span></div>
      <div class="field">Lớp:<span class="line"></span></div>
      <div class="field">Ngày:<span class="line"></span></div>
    </div>
  </section>

  <section class="region region-sbd" aria-label="Số báo danh">
    <span class="region-marker sbd tl"></span>
    <span class="region-marker sbd tr"></span>
    <span class="region-marker sbd bl"></span>
    <span class="region-marker sbd br"></span>
    <div class="section-title">Số báo danh</div>
    <div class="number-grid" id="sbdGrid" style="--cols: 6"></div>
  </section>

  <section class="region region-code" aria-label="Mã đề">
    <span class="region-marker code tl"></span>
    <span class="region-marker code tr"></span>
    <span class="region-marker code bl"></span>
    <span class="region-marker code br"></span>
    <div class="section-title">Mã đề</div>
    <div class="number-grid code-grid" id="codeGrid" style="--cols: 3"></div>
  </section>

  <div id="answerPanels"></div>

  <footer class="footer">
    Dùng bút chì tô đậm kín một ô tròn cho mỗi dòng. Xóa sạch nếu muốn sửa. Không bôi bẩn hoặc gấp phiếu.
  </footer>
</main>

<template id="answerPanelTemplate">
  <section class="region answer-panel" aria-label="">
    <span class="region-marker ans-panel tl"></span>
    <span class="region-marker ans-panel tr"></span>
    <span class="region-marker ans-panel bl"></span>
    <span class="region-marker ans-panel br"></span>
    <div class="section-title"></div>
    <div class="answer-head"><span></span><span>A</span><span>B</span><span>C</span><span>D</span></div>
    <div class="answer-grid"></div>
  </section>
</template>

<script>
const SUPPORTED_QUESTIONS = [10, 20, 30, 40];
const DEFAULT_QUESTIONS = 20;

function getQuestionCount() {
  const params = new URLSearchParams(window.location.search);
  const n = Number.parseInt(params.get('n') || params.get('q') || DEFAULT_QUESTIONS, 10);
  if (SUPPORTED_QUESTIONS.includes(n)) return n;
  return DEFAULT_QUESTIONS;
}

function bubbleCell() {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.innerHTML = '<span class="bubble" aria-hidden="true"></span>';
  return cell;
}

function renderNumberGrid(grid, cols) {
  grid.innerHTML = '';
  for (let digit = 0; digit < 10; digit++) {
    const label = document.createElement('div');
    label.className = 'cell';
    label.textContent = digit;
    grid.appendChild(label);
    for (let col = 0; col < cols; col++) {
      grid.appendChild(bubbleCell());
    }
  }
}

function renderAnswerPanel(panel, index, start, end) {
  panel.dataset.panel = String(index);
  panel.classList.add(`ans-panel-${index}`);
  panel.setAttribute('aria-label', `Câu ${start} đến ${end}`);
  const sideClass = index % 2 === 1 ? 'ans-left' : 'ans-right';
  panel.querySelectorAll('.region-marker').forEach(marker => {
    marker.classList.add(sideClass, `ans-panel-${index}`);
  });
  panel.querySelector('.section-title').textContent = `CÂU ${start} - ${end}`;

  const grid = panel.querySelector('.answer-grid');
  grid.innerHTML = '';
  for (let q = start; q <= end; q++) {
    const qCell = document.createElement('div');
    qCell.className = 'cell';
    qCell.textContent = q;
    grid.appendChild(qCell);
    for (let i = 0; i < 4; i++) {
      grid.appendChild(bubbleCell());
    }
  }
}

function renderSheet(numQ) {
  renderNumberGrid(document.getElementById('sbdGrid'), 6);
  renderNumberGrid(document.getElementById('codeGrid'), 3);

  const holder = document.getElementById('answerPanels');
  const template = document.getElementById('answerPanelTemplate');
  holder.innerHTML = '';

  const panelCount = Math.ceil(numQ / 10);
  for (let i = 1; i <= panelCount; i++) {
    const panel = template.content.firstElementChild.cloneNode(true);
    const start = (i - 1) * 10 + 1;
    const end = Math.min(i * 10, numQ);
    renderAnswerPanel(panel, i, start, end);
    holder.appendChild(panel);
  }

  const select = document.getElementById('numQ');
  select.value = String(numQ);
  window.history.replaceState({}, '', `${window.location.pathname}?n=${numQ}`);
}

document.getElementById('numQ').addEventListener('change', (event) => {
  renderSheet(Number.parseInt(event.target.value, 10));
});

renderSheet(getQuestionCount());
</script>
</body>
</html>
