<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>In Phiếu Trắc Nghiệm OMR</title>
<style>
  :root { --accent: #c8421a; }
  body {
    font-family: 'Segoe UI', Arial, sans-serif;
    background: #e2e8f0; margin: 0; padding: 20px;
    display: flex; flex-direction: column; align-items: center;
  }
  .controls {
    background: white; padding: 12px 24px; border-radius: 10px;
    box-shadow: 0 4px 6px rgba(0,0,0,.1); margin-bottom: 20px;
    display: flex; gap: 15px; align-items: center;
  }
  select, button { font-size: 14px; padding: 7px 14px; border-radius: 6px; }
  button { background: var(--accent); color: white; border: none; cursor: pointer; font-weight: bold; }
  button:hover { background: #b03a16; }

  /* ══ A4 — CỨNG 210×297mm, KHÔNG tràn trang ════════════════ */
  .a4-page {
    width: 210mm;
    height: 297mm;          /* cố định — không dùng min-height */
    overflow: hidden;       /* cắt nếu lệch tính toán */
    background: white;
    box-shadow: 0 10px 20px rgba(0,0,0,.15);
    position: relative;
    box-sizing: border-box;
  }

  /* ══ ANCHOR (4 góc) ════════════════════════════════════════ */
  .anc {
    position: absolute;
    width: 0; height: 0;
    border: 14px solid black;
    z-index: 10;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .anc.tl { top: 6px; left: 6px; }
  .anc.tr { top: 6px; right: 6px; }
  .anc.bl { bottom: 6px; left: 6px; }
  .anc.br { bottom: 6px; right: 6px; }

  /* ══ TIMING MARKS ══════════════════════════════════════════ */
  .tm-col {
    position: absolute;
    display: flex;
    flex-direction: column;
    z-index: 5;
  }
  .tm {
    background: black;
    width: 9px;
    flex-shrink: 0;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }

  /* ══ Wrapper co giãn để vừa 1 trang ═══════════════════════
     JS sẽ tính scale = 297mm / nội_dung_thực_tế và áp vào đây
  ══════════════════════════════════════════════════════════ */
  .inner {
    position: absolute;
    top: 0; left: 0;
    width: 210mm;
    transform-origin: top left;
    /* scale sẽ set bằng JS sau khi render */
  }

  /* ══ Nội dung ══════════════════════════════════════════════ */
  .content {
    padding: 10mm 14mm 8mm 18mm;
    box-sizing: border-box;
  }

  .school-info h2 { margin: 0 0 3px; font-size: 15px; color: #222; font-weight: 700; }
  .school-info p  { margin: 0; font-size: 12px; color: #555; }
  .student-info   { margin-top: 7px; font-size: 12px; line-height: 2; }
  .uline { border-bottom: 1px dotted #444; display: inline-block; }

  /* ══ OMR Frame ══════════════════════════════════════════════ */
  .omr-frame {
    position: relative;
    width: 100%;
    /* height tự động — JS scale sẽ co vừa trang */
    margin-top: 5mm;
  }
  .region {
    position: absolute;
    box-sizing: border-box;
  }
  .bubble-grid {
    display: grid;
    width: 100%; height: 100%;
    align-items: center; justify-items: center;
  }
  .region-title {
    position: absolute; top: -18px; left: 0; width: 100%;
    text-align: center; font-weight: bold; font-size: 10px;
    color: var(--accent); text-transform: uppercase; letter-spacing: .5px;
  }
  .bubble {
    width: 17px; height: 17px;
    border: 1.5px solid #000;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; font-weight: bold; color: #000;
    background: white;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .q-num {
    font-size: 11px; font-weight: bold; color: #333;
    display: flex; justify-content: flex-end;
    padding-right: 5px; align-items: center;
  }

  /* ══ Print ═════════════════════════════════════════════════ */
  @media print {
    body { background: transparent; padding: 0; margin: 0; }
    .controls { display: none; }
    .a4-page {
      box-shadow: none; margin: 0;
      width: 210mm; height: 297mm;
      overflow: hidden;
      page-break-after: avoid;
    }
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
      color-adjust: exact !important;
    }
    .anc  { border: 14px solid black !important; }
    .tm   { background: black !important; }
  }
</style>
</head>
<body>

<div class="controls">
  <label><b>Số câu hỏi:</b></label>
  <select id="numQ" onchange="renderSheet()">
    <option value="15">15 Câu</option>
    <option value="20" selected>20 Câu</option>
    <option value="30">30 Câu</option>
    <option value="40">40 Câu</option>
  </select>
  <button onclick="window.print()">🖨 In Phiếu OMR</button>
</div>

<div class="a4-page" id="a4">
  <!-- 4 Anchor góc — nằm ngoài .inner để luôn ở đúng góc A4 -->
  <div class="anc tl"></div>
  <div class="anc tr"></div>
  <div class="anc bl"></div>
  <div class="anc br"></div>

  <!-- Timing marks — vị trí set bằng JS sau scale -->
  <div class="tm-col" id="tmSBD"  style="left:36px;"></div>
  <div class="tm-col" id="tmAnsL" style="left:36px;"></div>
  <div class="tm-col" id="tmAnsR" style="right:36px;"></div>

  <!-- Wrapper sẽ bị scale để vừa 297mm -->
  <div class="inner" id="inner">
    <div class="content">
      <div class="school-info">
        <h2>PHIẾU TRẢ LỜI TRẮC NGHIỆM</h2>
        <p>Kỳ thi / Bài kiểm tra: <span class="uline" style="width:180px"></span></p>
        <div class="student-info">
          Họ và tên: <span class="uline" style="width:220px"></span><br>
          Lớp: <span class="uline" style="width:80px"></span> &nbsp;
          Ngày: <span class="uline" style="width:80px"></span>
        </div>
      </div>

      <!-- OMR Frame -->
      <div class="omr-frame" id="omrFrame">
        <div id="regSBD"   class="region" style="left:12%;top:22%;width:30%;height:28%;">
          <div class="region-title">Số Báo Danh</div>
          <div id="gridSBD" class="bubble-grid"></div>
        </div>
        <div id="regCODE"  class="region" style="left:55%;top:22%;width:15%;height:28%;">
          <div class="region-title">Mã Đề</div>
          <div id="gridCODE" class="bubble-grid"></div>
        </div>
        <div id="regLeft"  class="region" style="left:4%; top:54%;width:44%;height:44%;"></div>
        <div id="regRight" class="region" style="left:52%;top:54%;width:44%;height:44%;"></div>
      </div>
    </div>
  </div>
</div>

<script>
const MM_TO_PX = 96 / 25.4; // 1mm = 3.779px tại 96dpi
const PAGE_H_MM = 297;

function renderSheet() {
  const numQ = parseInt(document.getElementById('numQ').value);
  const half = Math.ceil(numQ / 2);

  // SBD
  const sbd = document.getElementById('gridSBD');
  sbd.style.gridTemplateColumns = 'repeat(6,1fr)';
  sbd.style.gridTemplateRows    = 'repeat(10,1fr)';
  sbd.innerHTML = '';
  for (let r = 0; r < 10; r++)
    for (let c = 0; c < 6; c++)
      sbd.innerHTML += `<div class="bubble">${r}</div>`;

  // Mã đề
  const code = document.getElementById('gridCODE');
  code.style.gridTemplateColumns = 'repeat(3,1fr)';
  code.style.gridTemplateRows    = 'repeat(10,1fr)';
  code.innerHTML = '';
  for (let r = 0; r < 10; r++)
    for (let c = 0; c < 3; c++)
      code.innerHTML += `<div class="bubble">${r}</div>`;

  // Câu hỏi — tính chiều cao OMR frame để vừa 1 trang
  const nLeft  = half;
  const nRight = numQ - half;

  // Tính chiều cao khả dụng cho omr-frame
  // = 297mm - padding_top(10mm) - header_est(28mm) - margin_top(5mm) - padding_bot(8mm)
  const headerMM = 28 + 5;
  const paddingMM = 10 + 8;
  const frameMM = PAGE_H_MM - headerMM - paddingMM; // ~246mm
  document.getElementById('omrFrame').style.height = frameMM + 'mm';

  renderPanel('regLeft',  1,        half,   nLeft);
  renderPanel('regRight', half + 1, numQ,   nRight);

  // Scale và timing marks sau khi layout xong
  requestAnimationFrame(() => requestAnimationFrame(() => {
    scaleToFit();
    requestAnimationFrame(() => requestAnimationFrame(placeTimingMarks));
  }));
}

function renderPanel(id, startQ, endQ, n) {
  const el = document.getElementById(id);
  if (n <= 0) { el.innerHTML = ''; return; }
  el.innerHTML = `<div class="bubble-grid"
    style="grid-template-columns:28% repeat(4,18%);grid-template-rows:repeat(${n},1fr);">
    ${Array.from({length:n}).map((_,i) => {
      const q = startQ + i;
      return `<div class="q-num">Câu ${q}:</div>
              <div class="bubble">A</div><div class="bubble">B</div>
              <div class="bubble">C</div><div class="bubble">D</div>`;
    }).join('')}
  </div>`;
}

// ── Scale nội dung vừa khít 297mm ───────────────────────────
function scaleToFit() {
  const inner = document.getElementById('inner');
  inner.style.transform = 'none'; // reset trước khi đo

  const innerH  = inner.getBoundingClientRect().height;
  const pageHpx = PAGE_H_MM * MM_TO_PX;

  if (innerH > pageHpx) {
    const scale = pageHpx / innerH;
    inner.style.transform = `scale(${scale})`;
    inner.style.transformOrigin = 'top left';
  }
}

// ── Timing marks theo vị trí DOM thực tế ────────────────────
function placeTimingMarks() {
  const a4Rect = document.getElementById('a4').getBoundingClientRect();

  // SBD — 10 hàng
  const sbdBubbles = document.querySelectorAll('#gridSBD .bubble');
  if (sbdBubbles.length === 60) {
    buildTM('tmSBD', Array.from({length:10}, (_,r) => sbdBubbles[r*6]), a4Rect, 6, 10);
  }
  // Câu hỏi trái/phải
  buildAnsTM('regLeft',  'tmAnsL', a4Rect, 7);
  buildAnsTM('regRight', 'tmAnsR', a4Rect, 7);
}

function buildTM(tmId, rowEls, a4Rect, markH, count) {
  const tmEl = document.getElementById(tmId);
  tmEl.innerHTML = '';
  if (!rowEls.length) return;

  const ys = rowEls.map(el => {
    const r = el.getBoundingClientRect();
    return r.top - a4Rect.top + r.height / 2;
  });

  tmEl.style.top = (ys[0] - markH/2) + 'px';
  for (let i = 0; i < ys.length; i++) {
    const tm = document.createElement('div');
    tm.className = 'tm';
    tm.style.height = markH + 'px';
    if (i < ys.length - 1) {
      const gap = ys[i+1] - ys[i] - markH;
      tm.style.marginBottom = Math.max(0, gap) + 'px';
    }
    tmEl.appendChild(tm);
  }
}

function buildAnsTM(panelId, tmId, a4Rect, markH) {
  const rows = document.querySelectorAll(`#${panelId} .q-num`);
  if (!rows.length) return;
  buildTM(tmId, Array.from(rows), a4Rect, markH, rows.length);
}

renderSheet();
</script>
</body>
</html>
